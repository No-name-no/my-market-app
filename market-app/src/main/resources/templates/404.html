<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>404 — Страница не найдена</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <span class="badge text-bg-success">Витрина магазина</span>
                </h2>
                <a href="/static" class="btn btn-secondary ms-auto bi bi-house"> На главную</a>
            </div>
        </div>
    </div>

    <div class="row p-5">
        <div class="col text-center">
            <h1 class="display-1 fw-bold text-secondary">404</h1>
            <p class="lead fs-2">Страница не найдена</p>
            <p class="fs-5 text-muted">
                К сожалению, запрашиваемая страница отсутствует или была перемещена.
            </p>
            <a href="/static" class="btn btn-success btn-lg mt-3">
                <i class="bi bi-arrow-left-circle"></i> Вернуться на главную
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</html>
