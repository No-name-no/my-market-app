spring.application.name=my-market-app

spring.r2dbc.url=r2dbc:h2:mem:///testdb?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.h2.console.enabled=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:import.sql

spring.data.redis.host = 127.0.0.1
spring.data.redis.port = 6379
spring.data.redis.timeout=2000ms
spring.data.web.pageable.serialization-mode=via-dto
# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

payment.service.url=http://127.0.0.1:8081

logging.level.org.springframework.security=DEBUG
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=market-service
# Тут указываем токен из Client credentials из Keycloak
spring.security.oauth2.client.registration.keycloak.client-secret=m3ziFFt9Beu6ObFXWZvGatliZhCUZF2M
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak.scope=openid

# Указываем полный путь до нашего Realm в Keycloak
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8085/realms/webflux-demo